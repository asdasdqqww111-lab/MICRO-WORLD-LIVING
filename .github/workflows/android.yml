name: Android APK

# Builds a debug APK on GitHub's runners (they ship JDK 17 + the Android SDK,
# which this sandbox does not have). Download the APK from the run's Artifacts
# section, or from the Release it is attached to.

on:
  push:
    branches: ["arena/**", "main"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Export debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3 stable
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/4.3.stable
          ls ~/.local/share/godot/export_templates/4.3.stable/android*

      - name: Point Godot at the Android + Java SDKs
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Import project
        run: godot --headless --path . --import

      - name: Headless acceptance tests
        run: godot --headless --path . tests/test_runner.tscn

      - name: Measure performance (real rasteriser via Mesa llvmpipe, GLES3)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils
          echo "--- glxinfo (sanity) ---"
          xvfb-run -a --server-args="-screen 0 1280x720x24" glxinfo -B | head -12 || true
          echo "--- perf probe ---"
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            godot --path . --rendering-driver opengl3 --resolution 1280x720 \
            tests/perf_probe.tscn 2>&1 | tail -60 || true
          echo "--- results file ---"
          cat docs/reports/perf_probe_results.txt || echo "no results file"

      - name: Commit measured results back to the branch
        if: always()
        run: |
          set -euo pipefail
          FILES="docs/reports/perf_probe_results.txt docs/reports/headless_test_results.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no result changes to commit"
          else
            git commit -m "ci: measured results (draw calls / triangles / headless checks) [skip ci]"
            git push
          fi

      - name: Create debug keystore and wire it into the preset
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("export_presets.cfg")
          text = p.read_text()
          if "keystore/debug=" not in text:
              ks = os.environ["GITHUB_WORKSPACE"] + "/debug.keystore"
              block = (
                  'keystore/debug="%s"\n'
                  'keystore/debug_user="androiddebugkey"\n'
                  'keystore/debug_password="android"\n'
                  'keystore/release=""\n'
                  'keystore/release_user=""\n'
                  'keystore/release_password=""\n' % ks
              )
              text = text.replace("[preset.0.options]\n\n", "[preset.0.options]\n\n" + block, 1)
              p.write_text(text)
          print(text[:1200])
          PY

      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/micro_world_living.apk
          ls -lh build/android
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("build/android/micro_world_living.apk")
          names = z.namelist()
          libs = sorted(n for n in names if n.startswith("lib/"))
          print("entries:", len(names))
          print("native libs:", libs)
          assert any("arm64-v8a" in n for n in libs), "no arm64-v8a native libs in APK"
          assert "assets/_cl_" in " ".join(names) or any(n.startswith("assets/") for n in names), "no game data in APK"
          print("APK looks well formed")
          PY

      - name: Verify APK (signature + manifest + contents)
        run: |
          set -euo pipefail
          APK=build/android/micro_world_living.apk
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          {
            echo "=== apksigner verify ==="
            "$BT/apksigner" verify --verbose --print-certs "$APK" || true
            echo ""
            echo "=== aapt2 dump badging (manifest) ==="
            "$BT/aapt2" dump badging "$APK" | head -20 || true
            echo ""
            echo "=== native libs + key entries ==="
            unzip -l "$APK" | awk '{print $4}' | grep -E "^(lib/|assets/|AndroidManifest|classes|META-INF|res/)" | head -30 || true
          } | tee APK_VERIFY.txt
          echo "--- fail if unsigned ---"
          "$BT/apksigner" verify "$APK"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          APK=build/android/micro_world_living.apk
          SHA=$(sha256sum "$APK" | cut -d" " -f1)
          SIZE=$(du -h "$APK" | cut -f1)
          PASSED=$(grep -m1 "checks passed:" docs/reports/headless_test_results.txt | tr -dc "0-9")
          FAILED=$(grep -m1 "checks failed:" docs/reports/headless_test_results.txt | tr -dc "0-9")
          {
            echo "## MICRO WORLD: LIVING — v0.1 (vertical slice, debug build)"
            echo ""
            echo "**التثبيت / Install**"
            echo ""
            echo "1. نزّل ملف APK من قسم Assets في هذه الصفحة."
            echo "2. على الهاتف: الإعدادات ← التطبيقات ← تثبيت تطبيقات غير معروفة ← اسمح للمتصفح/مدير الملفات."
            echo "3. افتح الملف واضغط Install. (توقيع debug، وليس نشرًا نهائيًا.)"
            echo ""
            echo "**جهاز مطلوب:** Android 5.0+ (arm64-v8a أو armeabi-v7a)، متوافق مع OpenGL ES 3.0."
            echo ""
            echo "**بيانات البناء**"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| الحجم | $SIZE |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| فحوص headless | $PASSED نجحت / $FAILED فشلت |"
            echo "| المحرك | Godot 4.3 stable — Compatibility (GLES3) |"
            echo "| الحزمة | com.microworldliving.game |"
            echo "| المعماريات | arm64-v8a + armeabi-v7a |"
            echo "| التوقيع | debug keystore (مؤقت للاختبار) |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo ""
            echo "**ما هو غير مُتحقَّق:** لم يُشغَّل هذا الملف على هاتف حقيقي بعد (لا جهاز في بيئة البناء)."
            echo "الأداء (FPS / draw calls) غير مقيس. عند التجربة افتح طبقة الأداء بـ F3،"
            echo "وسيُكتب \`user://perf_log.txt\` كل 5 ثوانٍ — أرسله لنعبّئ تقرير الأداء."
            echo ""
            echo "## قياس الأداء على rasteriser حقيقي (Mesa llvmpipe + GLES3)"
            echo ""
            echo "\`\`\`"
            sed -n '1,45p' docs/reports/perf_probe_results.txt 2>/dev/null || echo "(no measurements)"
            echo "\`\`\`"
            echo ""
            echo "## تحقق آلي من الـ APK (من داخل CI)"
            echo ""
            echo "\`\`\`"
            sed -n '1,60p' APK_VERIFY.txt
            echo "\`\`\`"
            echo ""
            echo "**التحكم:** عصا افتراضية يسار · سحب الكاميرا يمين · ATK / JUMP / USE / RUN / BAG / LOG / STAT."
            echo ""
            echo "راجع \`docs/reports/TEST_RUN_LOG.md\` و \`docs/KNOWN_ISSUES.md\` في المستودع."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.1-debug"
          APK=build/android/micro_world_living.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$APK" \
              --title "MICRO WORLD: LIVING — v0.1 debug APK" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
          echo "Release URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "Direct APK:  https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/micro_world_living.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: micro-world-living-debug-apk
          path: build/android/micro_world_living.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-test-results
          path: docs/reports/headless_test_results.txt
          if-no-files-found: warn
