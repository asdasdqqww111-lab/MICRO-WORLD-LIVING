name: Perf + Visual Probe

# Renders the real Eldoria Edition v1.0 game with Mesa GLES3 software rasteriser,
# runs the full headless acceptance harness, measures draw calls/triangles across
# all 7 zones, captures all 12 required verification screenshots, and commits
# the evidence back to the working branch.

on:
  push:
    branches: ["arena/**"]
    paths-ignore: ["docs/**", "**.md", ".github/workflows/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    name: Measure and capture (Eldoria v1.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3 stable
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project
        run: |
          mkdir -p docs/reports
          godot --headless --path . --import 2>&1 | tee docs/reports/ci_import.log
          godot --headless --path . --script res://tools/verify_stylized_import.gd 2>&1 | tee -a docs/reports/ci_import.log

      - name: Headless acceptance tests
        run: |
          set -o pipefail
          mkdir -p docs/reports
          timeout 180 godot --headless --path . tests/test_runner.tscn 2>&1 | tee docs/reports/ci_headless_stdout.log

      - name: Renderer + probes (Vulkan Mobile over Mesa Lavapipe)
        run: |
          set -e
          DIAG=docs/reports/ci_env.log
          mkdir -p docs/reports docs/screenshots
          rm -f docs/screenshots/*.png
          {
            echo "date: $(date -u)"
            echo "godot: $(command -v godot) - $(godot --version 2>&1 | head -1)"
          } > "$DIAG" 2>&1
          sudo apt-get update -qq >> "$DIAG" 2>&1
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers vulkan-tools mesa-utils >> "$DIAG" 2>&1

          echo "=== vulkaninfo ===" > docs/reports/ci_renderer.log
          vulkaninfo --summary >> docs/reports/ci_renderer.log 2>&1 || true

          DRIVER="vulkan"
          if ! vulkaninfo --summary >/dev/null 2>&1; then
            DRIVER="opengl3"
          fi
          echo "selected_driver=$DRIVER" >> docs/reports/ci_renderer.log

          echo "=== perf probe ===" >> docs/reports/ci_renderer.log
          timeout 420 xvfb-run -a --server-args="-screen 0 1280x720x24" \
            godot --path . --rendering-driver "$DRIVER" --resolution 1280x720 \
            tests/perf_probe.tscn > docs/reports/ci_perf_probe.log 2>&1
          echo "perf exit=$?" >> docs/reports/ci_renderer.log

          echo "=== screenshot probe ===" >> docs/reports/ci_renderer.log
          timeout 420 xvfb-run -a --server-args="-screen 0 1280x720x24" \
            godot --path . --rendering-driver "$DRIVER" --resolution 1280x720 \
            tests/screenshot_probe.tscn > docs/reports/ci_screenshot_gl.log 2>&1
          echo "screenshot exit=$?" >> docs/reports/ci_renderer.log

          tail -25 docs/reports/ci_screenshot_gl.log
          tail -30 docs/reports/ci_perf_probe.log
          ls -lh docs/screenshots

      - name: Upload screenshots and reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-screenshots-and-reports
          path: |
            docs/screenshots/*.png
            docs/reports/*
          if-no-files-found: warn

      - name: Commit evidence back to the branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/reports docs/screenshots 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "ci(probe): Eldoria v1.0 measured perf + 12 screenshots [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 3
            done
          fi
