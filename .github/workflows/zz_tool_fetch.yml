name: Tool fetch (temporary)

# Temporary helper: stores the Godot editor binary under a hidden git ref so the
# development sandbox (which can only reach github.com over git) can run the
# project headless. Removed again once the binary has been fetched.

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/zz_tool_fetch.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Store Godot under refs/arena-tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=4.4.1-stable
          mkdir carrier && cd carrier
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip" -O godot.zip
          ls -l godot.zip
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot.zip
          git commit -q -m "Godot ${V} linux editor binary (tooling only)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/arena-tools/godot-${V}"
